[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kestrel"
version = "0.1.0"
description = "A research-to-production systematic crypto trading platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Luke Graham" }]
license = { text = "MIT" }
dependencies = [
    "polars>=1.0",
    "pyarrow>=15",
    "httpx>=0.27",
    "duckdb>=1.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "anthropic>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
kestrel = "kestrel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kestrel"]
artifacts = ["src/kestrel/api/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: hits the real Binance data site (deselect with -m 'not network')"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["kestrel"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "duckdb.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
