# Kestrel configuration. Version-controlled on purpose: every backtest run stores a
# copy of the config it used (and its fingerprint), so old results keep their meaning
# when these values change. There are no defaults in code; every key is required.

# Currency all cash, P&L and costs are accounted in. Only instruments quoted in this
# currency can be traded (no FX conversion in the engine). The dashboard converts to
# A$ for display only.
account_currency = "USDT"

[costs]
# All costs in basis points (1 bp = 0.01%).

# Binance spot taker fee at the base (VIP 0) tier, paid in BNB: 25% off the 10 bps base, so
# 7.5 bps (from 2026-11-15; earlier runs used 10 and store it). CAVEAT: the discount needs
# "pay fees with BNB" switched on and a small BNB balance in the account, topped up as it is
# spent; without BNB, Binance charges the full 10 bps. The Binance venue values a fee paid
# in BNB at BNB's price and charges it to the account's cash (2026-11-21). Spot Testnet
# fills charge no commission at all, so tracking there shows fees below the model.
taker_fee_bps = 7.5

# Half the bid-ask spread, paid on every market order. An assumption: we have no
# order-book history yet. Majors like BTCUSDT usually quote far tighter than this.
half_spread_bps = 1

# Market impact follows the square-root law: impact = coef * sqrt(participation),
# where participation = order notional / quote volume of the last closed bar.
# 100 bps means an order of 1% of a bar's volume moves the price 10 bps against us.
impact_coef_bps = 100

# Orders above this fraction of the last closed bar's quote volume are rejected
# rather than filled at a price the market could not have offered.
max_participation = 0.01

[backtest]
# Only rebalance when a target weight differs from the current weight by more than
# this fraction of equity, so tiny adjustments don't pay fees.
no_trade_band = 0.02

# For strategies with stops: the share of equity lost if a stop is hit. The position
# is sized from it (risk / distance to the stop), capped at 100% of equity: spot, no
# leverage. A wide stop can be capped below this risk; the run records when it is.
risk_per_trade = 0.01

# Holdout: data from this date (UTC) on is reserved for one final test of a finished
# strategy. Pre-registered 2026-10-31, before any strategy research. Never move it.
holdout_start = 2025-11-01

# Exchange order rules (Binance LOT_SIZE and NOTIONAL filters). Verify against
# GET /api/v3/exchangeInfo before any live use; P4 will refresh these from the API.
[instruments.BTCUSDT]
step_size = "0.00001"
min_qty = "0.00001"
min_notional = "5"

[instruments.ETHUSDT]
step_size = "0.0001"
min_qty = "0.0001"
min_notional = "5"

[universe]
# For the coins a cross-sectional strategy ranks, which have no [instruments] entry.
# Binance's real step sizes differ per coin and aren't in the archive, so quantities are
# rounded to a fine step; the 5 USDT minimum order applies as on the exchange.
step_size = "0.00000001"
min_qty = "0.00000001"
min_notional = "5"

# Smaller coins quote wider spreads than BTC. With no order-book history, each coin's
# half-spread is an assumption set by its median daily quote volume (USDT) over the last
# 30 days, known at the time: [minimum volume, half-spread in bps], highest volume first.
# Below 20M a day a coin can't be bought by the momentum strategy, but a held coin can
# fall there, so it gets the widest band. Rule of thumb, not a measurement: research
# notes require the edge to survive twice the cost actually paid.
# (Estimating spreads from daily highs and lows, Abdi and Ranaldo 2017, was tried and
# dropped: on daily bars it gave BTC a median of 21 bps, against a real spread near 1.)
volume_window_days = 30
spread_tiers = [[500_000_000, 1], [100_000_000, 3], [20_000_000, 8], [0, 15]]

[risk]
# Limits on paper and live trading (kestrel.execution.safety); backtests ignore them.
# Tripping one halts the account until it is resumed by hand, with a reason.

# No single order above this notional (USDT). The account is ~330 USDT, so a bigger
# order means something is wrong, not that the strategy wants more.
max_order_usdt = "500"

# Halt when equity falls more than this fraction between two consecutive daily marks.
# At trend-vol-target's exposure that would be extreme: a human looks before it trades.
max_daily_loss = 0.15

# Halt when equity falls more than this fraction below its peak: the scorecard's limit.
max_drawdown = 0.5

# Forex (P6): its own market, trial pool and holdout (CLAUDE.md). Both fixed 2026-11-23,
# before any forex data was ingested. Never move the date; adding a pair is a note.
[fx]
holdout_start = 2023-01-01
pairs = ["EURUSD", "GBPUSD", "USDJPY", "USDCHF", "USDCAD", "AUDUSD", "NZDUSD", "EURGBP", "EURJPY", "GBPJPY"]
