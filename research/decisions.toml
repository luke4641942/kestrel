# What to do with each strategy that has been tested: pursue, watch or drop.
#
# A decision is a judgement made from all the evidence (research notes, runs and
# validation studies), recorded with its reason, like a note's rejection. The dashboard
# shows this list first. Change an entry only with a new reason and today's date.
#
#   pursue  test it forward (paper trading); the only way left to learn more
#   watch   interesting, but waiting on something specific before it can be pursued
#   drop    the evidence says no; don't revive it by tuning

[[decision]]
strategy = "trend-vol-target"
name = "Trend following with volatility targeting"
market = "BTCUSDT 1d"
decision = "pursue"
decided = 2026-11-12
reason = "The only strategy that held up on data it wasn't tuned on (walk-forward Sharpe 0.97, holding BTC 0.71) and wasn't sensitive to its settings. Could still be luck (deflated 34%), so it is paper-traded, not traded with money."
evidence = ["trend-following-robustness-and-walk-forward-btc", "trend-following-with-volatility-targeting-btc", "trend-following-through-the-2018-crash-unseen"]

