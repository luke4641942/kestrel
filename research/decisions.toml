nchanged: plain Sharpe 1.25, MACD 1.41 (deflated 56%), drawdowns -59% and -51%. Dropped (Luke, 2026-11-15) after both holdout tests failed and a stablecoin filter didn't help either (note monthly-rotation-with-a-stablecoin-filter: Sharpe 1.19, drawdown -59%, walk-forward 3 of 11)."
