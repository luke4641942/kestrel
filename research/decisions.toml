# What to do with each strategy that has been tested: pursue, watch or drop.
#
# A decision is a judgement made from all the evidence (research notes, runs and
# validation studies), recorded with its reason, like a note's rejection. The dashboard
# shows this list first. Change an entry only with a new reason and today's date.
#
#   pursue  test it forward (paper trading); the only way left to learn more
#   watch   interesting, but waiting on something specific before it can be pursued
#   drop    the evidence says no; don't revive it by tuning

[[decision]]
strategy = "trend-vol-target"
name = "Trend following with volatility targeting"
market = "BTCUSDT 1d"
decision = "pursue"
decided = 2026-11-14
reason = "Paper-traded as risk-managed holding, not as a proven edge. Scorecard on BTC 2020-25 (completed 2026-11-14): passes edge (Sharpe 1.21 vs 1.07; +639% vs +423% at the same exposure), start dates, costs, trades, drawdown (-48%) and robustness; fails luck (deflated 28%) and out of sample (beat holding's Sharpe in only 2 of 7 six-month walk-forward windows, though its joined out-of-sample Sharpe was 0.97 vs 0.72)."
evidence = ["trend-vol-target-btc-scorecard-walk-forward", "trend-following-robustness-and-walk-forward-btc", "trend-following-with-volatility-targeting-btc", "trend-following-through-the-2018-crash-unseen"]

